; PlatformIO project for the Mix 'n Smash firmware (Wemos ESP-WROOM-32).
; The build itself is plain ESP-IDF (CMakeLists.txt, sdkconfig.defaults),
; so `idf.py build` keeps working from this folder too.

[platformio]
src_dir = main
default_envs = wemos-esp32

[env:wemos-esp32]
platform = espressif32 @ ^7.1.3
framework = espidf
board = esp32dev
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
