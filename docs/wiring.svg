<svg xmlns="http://www.w3.org/2000/svg" width="960" height="870" viewBox="0 0 960 870" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
  <style>
    .box { fill: #f7f7f9; stroke: #444; stroke-width: 1.5; rx: 8; }
    .title { font-size: 20px; font-weight: 700; fill: #222; }
    .sub { font-size: 13px; fill: #555; }
    .h { font-size: 14px; font-weight: 700; fill: #222; }
    .t { fill: #333; }
    .m { fill: #666; font-size: 12px; }
    .pin { fill: #222; font-size: 12px; font-weight: 600; }
    .p5 { stroke: #d62828; stroke-width: 3; fill: none; }
    .gnd { stroke: #222; stroke-width: 3; fill: none; }
    .data { stroke: #1a9c3c; stroke-width: 2.5; fill: none; }
    .btn { stroke: #555; stroke-width: 1.5; fill: none; }
    .opt { stroke: #8a6d00; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .opt5 { stroke: #d62828; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    .dot5 { fill: #d62828; }
    .dotg { fill: #222; }
    .note { fill: #333; font-size: 12.5px; }
    .halo { paint-order: stroke; stroke: #f7f7f9; stroke-width: 7px; stroke-linejoin: round; }
  </style>

  <rect width="960" height="870" fill="#ffffff"/>
  <text x="30" y="34" class="title">Mix 'n Smash: minimal wiring</text>
  <text x="30" y="54" class="sub">ESP32 box next to the strip, buttons over an ethernet cable. Solid: the minimal setup, no extra parts. Dashed: optional button lights.</text>

  <!-- 5 V rails -->
  <line x1="80" y1="150" x2="900" y2="150" class="gnd"/>
  <line x1="80" y1="175" x2="900" y2="175" class="p5"/>
  <text x="30" y="154" class="pin">GND</text>
  <text x="30" y="179" class="pin" fill="#d62828">+5 V</text>

  <!-- Power supply -->
  <rect x="360" y="70" width="320" height="56" class="box"/>
  <text x="372" y="92" class="h">5 V supply, 2 A or more</text>
  <text x="372" y="110" class="m">or a power bank with a 2 A port (USB cable cut and soldered)</text>
  <line x1="430" y1="126" x2="430" y2="175" class="p5"/>
  <line x1="640" y1="126" x2="640" y2="150" class="gnd"/>
  <circle cx="430" cy="175" r="4.5" class="dot5"/>
  <circle cx="640" cy="150" r="4.5" class="dotg"/>
  <text x="438" y="142" class="m">+5 V</text>
  <text x="648" y="142" class="m">GND</text>

  <!-- ESP32 box -->
  <rect x="60" y="260" width="240" height="370" class="box"/>
  <text x="72" y="282" class="h">ESP32 box</text>
  <text x="72" y="300" class="m">Wemos ESP-WROOM-32 (any ESP32 devkit)</text>
  <line x1="120" y1="260" x2="120" y2="175" class="p5"/>
  <line x1="180" y1="260" x2="180" y2="150" class="gnd"/>
  <circle cx="120" cy="175" r="4.5" class="dot5"/>
  <circle cx="180" cy="150" r="4.5" class="dotg"/>
  <text x="100" y="250" class="pin" fill="#d62828">VIN (5V)</text>
  <text x="166" y="250" class="pin">GND</text>
  <text x="196" y="226" class="m">(not through the USB port)</text>

  <text x="292" y="326" class="pin" text-anchor="end">GPIO 16</text>
  <text x="72" y="326" class="m">strip data</text>
  <text x="292" y="404" class="pin" text-anchor="end">GPIO 25</text>
  <text x="292" y="434" class="pin" text-anchor="end">GPIO 26</text>
  <text x="292" y="464" class="pin" text-anchor="end">GPIO 27</text>
  <text x="292" y="490" class="pin" text-anchor="end">GND</text>
  <text x="72" y="404" class="m">red button</text>
  <text x="72" y="434" class="m">yellow button</text>
  <text x="72" y="464" class="m">blue button</text>
  <text x="72" y="490" class="m">buttons' common</text>

  <text x="72" y="524" class="m" fill="#8a6d00">optional button lights:</text>
  <text x="292" y="546" class="pin" text-anchor="end" fill="#d62828">+5 V rail</text>
  <text x="292" y="574" class="pin" text-anchor="end">GPIO 32</text>
  <text x="292" y="602" class="pin" text-anchor="end">GPIO 33</text>
  <text x="292" y="624" class="pin" text-anchor="end">GPIO 14</text>
  <text x="72" y="574" class="m">red light</text>
  <text x="72" y="602" class="m">yellow light</text>
  <text x="72" y="624" class="m">blue light</text>

  <!-- Strip -->
  <rect x="480" y="300" width="420" height="44" rx="4" fill="#1d1f26" stroke="#444" stroke-width="1.5"/>
  <text x="690" y="327" fill="#f2f2f2" font-size="14" font-weight="700" text-anchor="middle">WS2812B strip, 300 LEDs (5 m at 60/m, 3 m at 100/m)</text>
  <text x="484" y="362" class="m">LED 0: player, lives</text>
  <text x="896" y="362" class="m" text-anchor="end">far end: dots start here &#9664;</text>
  <line x1="520" y1="300" x2="520" y2="175" class="p5"/>
  <line x1="560" y1="300" x2="560" y2="150" class="gnd"/>
  <circle cx="520" cy="175" r="4.5" class="dot5"/>
  <circle cx="560" cy="150" r="4.5" class="dotg"/>
  <text x="504" y="292" class="pin" fill="#d62828">+5V</text>
  <text x="566" y="292" class="pin">GND</text>
  <text x="596" y="292" class="m">solder to the pads at LED 0, wire 0.75 mm&#178; or thicker, short</text>

  <!-- Data wire -->
  <line x1="300" y1="322" x2="480" y2="322" class="data"/>
  <text x="390" y="314" class="m" text-anchor="middle">DIN, 30 cm at most</text>

  <!-- Button wires into the cable -->
  <line x1="300" y1="400" x2="650" y2="400" class="btn"/>
  <line x1="300" y1="430" x2="650" y2="430" class="btn"/>
  <line x1="300" y1="460" x2="650" y2="460" class="btn"/>
  <line x1="300" y1="486" x2="650" y2="486" class="btn"/>
  <!-- optional light wires -->
  <line x1="300" y1="542" x2="650" y2="542" class="opt5"/>
  <line x1="300" y1="570" x2="650" y2="570" class="opt"/>
  <line x1="300" y1="598" x2="650" y2="598" class="opt"/>
  <line x1="300" y1="620" x2="650" y2="620" class="opt"/>

  <!-- Cable band -->
  <text x="480" y="374" class="m" text-anchor="middle" font-weight="700">Cat5/Cat6 ethernet cable, 5 m (20 m is still fine)</text>
  <rect x="350" y="380" width="260" height="252" rx="10" fill="#e9ecf3" stroke="#8b93a7" stroke-width="1.5" fill-opacity="0.85"/>
  <text x="480" y="395" class="m" text-anchor="middle">white-orange</text>
  <text x="480" y="425" class="m" text-anchor="middle">white-green</text>
  <text x="480" y="455" class="m" text-anchor="middle">white-brown</text>
  <text x="480" y="481" class="m" text-anchor="middle">blue (GND)</text>
  <text x="480" y="537" class="m" text-anchor="middle">white-blue (+5 V)</text>
  <text x="480" y="565" class="m" text-anchor="middle">orange</text>
  <text x="480" y="593" class="m" text-anchor="middle">green</text>
  <text x="480" y="615" class="m" text-anchor="middle">brown</text>
  <text x="480" y="650" class="m" text-anchor="middle">dashed: only with lit buttons (5 V LED modules)</text>

  <!-- Button bar -->
  <text x="775" y="374" class="h" text-anchor="middle">Button bar</text>
  <rect x="650" y="380" width="250" height="252" class="box"/>
  <circle cx="700" cy="400" r="9" fill="#ff3b30" stroke="#444"/>
  <circle cx="700" cy="430" r="9" fill="#ffbe00" stroke="#444"/>
  <circle cx="700" cy="460" r="9" fill="#2f6bff" stroke="#444"/>
  <line x1="709" y1="400" x2="800" y2="400" class="btn"/>
  <line x1="709" y1="430" x2="800" y2="430" class="btn"/>
  <line x1="709" y1="460" x2="800" y2="460" class="btn"/>
  <line x1="800" y1="400" x2="800" y2="486" class="btn"/>
  <line x1="650" y1="486" x2="800" y2="486" class="btn"/>
  <circle cx="800" cy="430" r="3" fill="#555"/>
  <circle cx="800" cy="460" r="3" fill="#555"/>
  <circle cx="800" cy="486" r="3" fill="#555"/>
  <text x="718" y="404" class="t halo">red</text>
  <text x="718" y="434" class="t halo">yellow</text>
  <text x="718" y="464" class="t halo">blue</text>
  <text x="808" y="490" class="m">common</text>

  <!-- optional lights inside the bar: LED+ on +5 V, LED- via its resistor to the GPIO -->
  <line x1="650" y1="542" x2="840" y2="542" class="opt5"/>
  <line x1="840" y1="542" x2="840" y2="620" class="opt5"/>
  <circle cx="840" cy="570" r="3" class="dot5"/>
  <circle cx="840" cy="598" r="3" class="dot5"/>
  <circle cx="840" cy="620" r="3" class="dot5"/>
  <line x1="650" y1="570" x2="730" y2="570" class="opt"/>
  <line x1="650" y1="598" x2="730" y2="598" class="opt"/>
  <line x1="650" y1="620" x2="730" y2="620" class="opt"/>
  <rect x="730" y="561" width="80" height="18" rx="4" fill="#fff" stroke="#ff3b30" stroke-width="1.5"/>
  <rect x="730" y="589" width="80" height="18" rx="4" fill="#fff" stroke="#ffbe00" stroke-width="1.5"/>
  <rect x="730" y="611" width="80" height="18" rx="4" fill="#fff" stroke="#2f6bff" stroke-width="1.5"/>
  <text x="770" y="574" class="m" text-anchor="middle">R + white LED</text>
  <text x="770" y="602" class="m" text-anchor="middle">R + white LED</text>
  <text x="770" y="624" class="m" text-anchor="middle">R + white LED</text>
  <line x1="810" y1="570" x2="840" y2="570" class="opt"/>
  <line x1="810" y1="598" x2="840" y2="598" class="opt"/>
  <line x1="810" y1="620" x2="840" y2="620" class="opt"/>
  <text x="846" y="546" class="m" fill="#d62828">+5 V</text>
  <text x="775" y="650" class="m" text-anchor="middle">LED minus via its resistor to the GPIO, low = on</text>

  <!-- Notes -->
  <rect x="30" y="672" width="900" height="186" class="box"/>
  <text x="42" y="693" class="h">Notes</text>
  <text x="42" y="713" class="note">1. Power the strip straight from the supply, not through the ESP32 board: its USB connector and traces cannot carry the strip's current.</text>
  <text x="42" y="733" class="note">2. The ESP32 and the strip must share GND (here through the rails). Keep the data wire from GPIO 16 to DIN short, 30 cm at most.</text>
  <text x="42" y="753" class="note">3. 3.3 V data straight into the strip works for most WS2812B strips. If the first LEDs flicker or the strip stays dark: add a 74AHCT125.</text>
  <text x="42" y="773" class="note">4. Buttons need no resistors: the firmware turns on the internal pull-ups. Phantom presses on a long cable? Add 10 k&#937; pull-ups at the ESP32.</text>
  <text x="42" y="793" class="note">5. Feed the strip at LED 0. With brightness 80 and the 1000 mA limit one feed is enough; above brightness 100, also feed the far end.</text>
  <text x="42" y="813" class="note">6. Lights: white or blue 5 V LED modules only. The GPIO sinks about 11 mA; when off the pin sees roughly 2.5 to 2.9 V (measure: under 3.3 V).</text>
  <text x="42" y="833" class="note">7. menuconfig &#8594; Mix 'n Smash: 300 LEDs, data GPIO 16, buttons GPIO 25/26/27, current limit 1000 mA, "Lights in the buttons" on when wired.</text>
  <text x="42" y="853" class="note">8. GPIO 34 to 39 have no pull-ups and cannot drive anything; GPIO 0, 2, 12, 15 are strapping pins. Keep buttons and lights off those.</text>
</svg>
